<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;font-weight:700;src:url(%FONT%plus-jakarta-sans-latin-700-normal.woff2)}
@font-face{font-family:J;font-weight:800;src:url(%FONT%plus-jakarta-sans-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1000px;height:1500px;background:#FBF9F3;font-family:J,sans-serif;color:#0B1B33;position:relative;overflow:hidden}
.top{background:#0B1B33;height:640px;padding:90px 80px 0;position:relative}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:60px;background:#FBF9F3;border-radius:60px 60px 0 0}
.k{color:#C9A24B;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:30px}
h1{color:#fff;font-weight:800;font-size:88px;line-height:1.06;margin-top:30px}
ul{list-style:none;padding:0 80px;margin-top:10px}
li{display:flex;gap:28px;align-items:baseline;padding:22px 0;border-bottom:3px solid #E7DFC9}
li b{flex:none;min-width:170px;font-size:50px;font-weight:800;color:#B8872A}
li span{font-size:42px;font-weight:700;line-height:1.25}
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#0B1B33;display:flex;align-items:center;justify-content:space-between;padding:0 80px;color:#fff}
.foot div{font-weight:800;font-size:38px}.foot small{font-size:30px;color:#C9A24B;font-weight:700}
</style></head><body><div class="top"><div class="k">%KICK%</div><h1>%TITLE%</h1></div><ul>%LI%</ul>
<div class="foot"><div>Syed Shahmikh Ali</div><small>shahmikh.com</small></div></body></html>
